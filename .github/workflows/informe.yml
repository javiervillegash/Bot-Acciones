# Opción en la nube (gratis, sin tener el PC encendido): sube esta carpeta a un
# repositorio de GitHub y añade TELEGRAM_TOKEN y TELEGRAM_CHAT_ID en
# Settings > Secrets and variables > Actions.
name: Informe diario acciones

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC (tras el cierre de Wall Street), lunes a viernes
  workflow_dispatch:           # permite lanzarlo a mano desde GitHub

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
